<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>närma · crm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>

  <div class="login-wrap">
    <div class="login-panel">
      <div class="login-logo-wrap">
        <div class="login-logo">när<span>ma</span></div>
        <div class="login-tagline">crm de clientes</div>
      </div>

      <div class="login-form-box">
        <div class="form-group">
          <label class="form-label" style="color:rgba(240,235,231,0.55);">Usuario</label>
          <input type="text" id="login-usuario" placeholder="tu.usuario" class="login-input" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label class="form-label" style="color:rgba(240,235,231,0.55);">Contraseña</label>
          <input type="password" id="login-pass" placeholder="••••••••" class="login-input" autocomplete="current-password"/>
        </div>
        <div id="login-error" style="display:none;" class="login-error"></div>
        <button class="btn-login" id="btn-login">Ingresar →</button>
      </div>
    </div>
  </div>

  <script>
    const btnLogin = document.getElementById('btn-login');
    const inputUsuario = document.getElementById('login-usuario');
    const inputPass = document.getElementById('login-pass');
    const errorBox = document.getElementById('login-error');

    async function intentarLogin() {
      const username = inputUsuario.value.trim();
      const password = inputPass.value;
      errorBox.style.display = 'none';

      if (!username || !password) {
        errorBox.textContent = 'Ingresá usuario y contraseña.';
        errorBox.style.display = 'block';
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Ingresando...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include',
        });

        // El servidor responde con 302 en caso de éxito.
        // fetch sigue el redirect automáticamente y expone res.redirected = true.
        // El Set-Cookie viaja en la respuesta 302 → el browser lo almacena
        // antes de que este código continúe → no hay condición de carrera.
        if (res.redirected) {
          window.location.href = res.url;
          return;
        }

        // En caso de error (401, 400, 500) el servidor responde con JSON.
        const data = await res.json();
        throw new Error(data.error || 'Error al iniciar sesión');
      } catch (e) {
        errorBox.textContent = e.message;
        errorBox.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.textContent = 'Ingresar →';
      }
    }

    btnLogin.addEventListener('click', intentarLogin);
    inputPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') intentarLogin(); });
    inputUsuario.addEventListener('keydown', (e) => { if (e.key === 'Enter') intentarLogin(); });
  </script>
</body>
</html>
