<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>närma · crm</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-panel" style="text-align:center;">
      <div class="login-logo">när<span>ma</span></div>
      <div class="card" style="margin-top:24px;">
        <div class="card-title">acceso restringido</div>
        <p style="font-size:12px;color:var(--text2);margin-bottom:14px;">No tenés permisos para ver esta sección.</p>
        <!-- El destino depende del rol: para el rol 'comedor', /clientes es
             otro 403 y el botón sería un círculo. /api/me es lo único de la
             API que todos los roles pueden consultar. -->
        <a href="/clientes" class="btn-primary btn-block" id="btn-volver">Volver</a>
      </div>
    </div>
  </div>

  <script>
    (async function () {
      const btn = document.getElementById('btn-volver');
      try {
        const res = await fetch('/api/me');
        if (!res.ok) return;
        const rol = ((await res.json()).user || {}).rol;
        if (rol === 'comedor') { btn.href = '/retiros'; btn.textContent = 'Volver a retiros'; }
        else if (rol === 'operador') { btn.textContent = 'Volver a clientes'; }
        else { btn.href = '/dashboard'; btn.textContent = 'Volver al dashboard'; }
      } catch (e) { /* sin red: queda el destino por defecto */ }
    })();
  </script>
</body>
</html>
