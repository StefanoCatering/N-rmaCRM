<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>närma · crm · dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <div class="app">
    <div class="nav" id="nav"></div>

    <div class="view">
      <div class="view-header">
        <div>
          <div class="view-header-title">dashboard</div>
          <div class="view-header-sub">Resumen comercial</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">rango de fechas</div>
        <div class="filter-row">
          <input type="date" id="f-fecha-desde" title="Fecha desde"/>
          <input type="date" id="f-fecha-hasta" title="Fecha hasta"/>
          <button class="btn-primary" id="btn-aplicar-rango">Aplicar</button>
        </div>
      </div>

      <div class="metric-grid" id="metric-grid"></div>

      <div class="card">
        <div class="card-title">evolución de clientes activos (últimos 6 meses)</div>
        <div id="chart-evolucion"><div class="empty-state">Cargando...</div></div>
      </div>

      <div class="card">
        <div class="card-title">ticket promedio por segmento</div>
        <div class="metric-grid" id="ticket-segmento"></div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    (async function () {
      await ensureSession();
      renderNav('/dashboard');
      await cargarKpis();
      document.getElementById('btn-aplicar-rango').addEventListener('click', () => {
        const desde = document.getElementById('f-fecha-desde').value;
        const hasta = document.getElementById('f-fecha-hasta').value;
        if (!desde || !hasta) { alert('Seleccioná ambas fechas'); return; }
        if (desde > hasta) { alert('La fecha desde no puede ser posterior a la fecha hasta'); return; }
        cargarKpis(desde, hasta);
      });
    })();

    async function cargarKpis(fechaDesde, fechaHasta) {
      const params = new URLSearchParams();
      if (fechaDesde) params.set('fecha_desde', fechaDesde);
      if (fechaHasta) params.set('fecha_hasta', fechaHasta);
      const qs = params.toString();
      const k = await api('/api/clientes/kpis' + (qs ? `?${qs}` : ''));

      document.getElementById('f-fecha-desde').value = k.fecha_desde;
      document.getElementById('f-fecha-hasta').value = k.fecha_hasta;
      const rangoLabel = `${fmtFecha(k.fecha_desde)} – ${fmtFecha(k.fecha_hasta)}`;

      document.getElementById('metric-grid').innerHTML = `
        <div class="metric metric-blue">
          <div class="metric-label">Clientes activos</div>
          <div class="metric-value">${k.total_activos}</div>
          <div class="metric-sub">total</div>
        </div>
        <div class="metric metric-green">
          <div class="metric-label">Altas</div>
          <div class="metric-value">${k.altas}</div>
          <div class="metric-sub">nuevos clientes · ${rangoLabel}</div>
        </div>
        <div class="metric metric-yellow">
          <div class="metric-label">Bajas</div>
          <div class="metric-value">${k.bajas}</div>
          <div class="metric-sub">clientes dados de baja · ${rangoLabel}</div>
        </div>
        <div class="metric metric-pink">
          <div class="metric-label">Ticket promedio general</div>
          <div class="metric-value" style="font-size:16px;">${fmtGs(k.ticket_promedio_general)}</div>
          <div class="metric-sub">${rangoLabel}</div>
        </div>
        <div class="metric metric-blue">
          <div class="metric-label">Pedidos recepcionados</div>
          <div class="metric-value">${k.pedidos_recepcionados}</div>
          <div class="metric-sub">${rangoLabel}</div>
        </div>
        <div class="metric metric-green">
          <div class="metric-label">Viandas entregadas</div>
          <div class="metric-value">${k.viandas_entregadas}</div>
          <div class="metric-sub">según fecha de entrega · ${rangoLabel}</div>
        </div>
        <div class="metric metric-yellow">
          <div class="metric-label">Viandas de cortesía</div>
          <div class="metric-value">${k.cortesias}</div>
          <div class="metric-sub">${rangoLabel}</div>
        </div>
      `;

      document.getElementById('ticket-segmento').innerHTML = `
        <div class="metric metric-blue">
          <div class="metric-label">Particular</div>
          <div class="metric-value" style="font-size:16px;">${fmtGs(k.ticket_promedio_segmento.particular)}</div>
        </div>
        <div class="metric metric-green">
          <div class="metric-label">Empresa</div>
          <div class="metric-value" style="font-size:16px;">${fmtGs(k.ticket_promedio_segmento.empresa)}</div>
        </div>
      `;

      renderEvolucion(k.evolucion_activos);
    }

    function renderEvolucion(serie) {
      const cont = document.getElementById('chart-evolucion');
      if (!serie.length) { cont.innerHTML = '<div class="empty-state">Sin datos suficientes.</div>'; return; }

      const max = Math.max(1, ...serie.map(p => p.activos));
      const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

      cont.innerHTML = `<div class="chart-bars">${serie.map(p => {
        const [, m] = p.mes.split('-');
        const alto = Math.max(6, Math.round((p.activos / max) * 120));
        return `
          <div class="chart-bar-col">
            <div class="chart-bar-value">${p.activos}</div>
            <div class="chart-bar" style="height:${alto}px;"></div>
            <div class="chart-bar-label">${MESES[parseInt(m, 10) - 1]}</div>
          </div>`;
      }).join('')}</div>`;
    }
  </script>
</body>
</html>
