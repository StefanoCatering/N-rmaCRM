<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>närma · crm · pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <div class="app">
    <div class="nav" id="nav"></div>

    <div class="view">
      <div class="view-header">
        <div>
          <div class="view-header-title">historial de pedidos</div>
          <div class="view-header-sub" id="resultado-count"></div>
        </div>
      </div>

      <div class="card">
        <div class="filter-row">
          <input type="text" id="f-cliente" list="lista-clientes" placeholder="Buscar cliente por nombre o cédula..."/>
          <datalist id="lista-clientes"></datalist>
          <input type="date" id="f-fecha-desde" title="Fecha desde"/>
          <input type="date" id="f-fecha-hasta" title="Fecha hasta"/>
          <select id="f-estado">
            <option value="">Todos los estados</option>
            <option value="activo">Activo</option>
            <option value="pausado">Pausado</option>
            <option value="inactivo">Inactivo</option>
            <option value="baja">Baja</option>
          </select>
          <select id="f-estado-pago">
            <option value="">Todos los pagos</option>
            <option value="pagado">Pagado</option>
            <option value="pendiente">Pendiente</option>
            <option value="parcial">Parcial</option>
          </select>
          <select id="f-tipo-vianda">
            <option value="">Todas las viandas</option>
            <option value="saludable">Saludable</option>
            <option value="low_carb">Low Carb</option>
            <option value="economico">Económico</option>
            <option value="sin_vianda">Sin vianda</option>
          </select>
          <select id="f-segmento">
            <option value="">Todos los segmentos</option>
            <option value="particular">Particular</option>
            <option value="empresa">Empresa</option>
          </select>
          <select id="f-canal">
            <option value="">Todos los canales</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="redes">Redes sociales</option>
            <option value="b2b">B2B</option>
            <option value="boca_a_boca">Boca a boca</option>
            <option value="embajador">Embajador</option>
          </select>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <button class="btn-secondary" id="btn-limpiar-filtros" style="font-size:12px;">Limpiar filtros</button>
          <button class="btn-secondary" id="btn-exportar" style="font-size:12px;">↓ Exportar Excel</button>
        </div>

        <div id="tabla-cont"><div class="empty-state">Cargando...</div></div>

        <div class="metric-grid" id="resumen-grid" style="margin-top:14px;"></div>
      </div>
    </div>
  </div>

  <!-- Modal modificar pago de un pedido (admin y operador) -->
  <div id="modal-pago" class="hidden" style="position:fixed;inset:0;background:rgba(8,43,85,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;">
    <div class="card" style="max-width:360px;width:100%;">
      <div class="card-title">modificar pago</div>
      <div class="form-group">
        <label class="form-label">Estado de pago</label>
        <select id="modal-pago-estado">
          <option value="pagado">Pagado</option>
          <option value="pendiente">Pendiente</option>
          <option value="parcial">Parcial</option>
        </select>
      </div>
      <div class="form-group hidden" id="modal-pago-grupo-monto">
        <label class="form-label">Monto abonado (Gs.)</label>
        <input type="number" id="modal-pago-monto" placeholder="Ej: 50000" step="1" min="0"/>
      </div>
      <div id="modal-pago-error" class="form-error hidden"></div>
      <div class="btn-row">
        <button class="btn-primary" id="modal-pago-guardar">Guardar</button>
        <button class="btn-secondary" id="modal-pago-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let timerBuscar = null;
    let clienteMap = {}; // texto mostrado -> cliente_id
    let clienteIdSeleccionado = null;
    let pedidoEditando = null;

    (async function () {
      await ensureSession();
      renderNav('/pedidos');

      cargarPedidos();

      ['f-fecha-desde', 'f-fecha-hasta', 'f-estado', 'f-estado-pago', 'f-tipo-vianda', 'f-segmento', 'f-canal'].forEach(id => {
        document.getElementById(id).addEventListener('change', cargarPedidos);
      });

      document.getElementById('f-cliente').addEventListener('input', () => {
        clearTimeout(timerBuscar);
        timerBuscar = setTimeout(() => {
          actualizarSugerenciasCliente();
          actualizarClienteSeleccionado();
          cargarPedidos();
        }, 300);
      });

      document.getElementById('btn-limpiar-filtros').addEventListener('click', () => {
        document.getElementById('f-cliente').value = '';
        document.getElementById('f-fecha-desde').value = '';
        document.getElementById('f-fecha-hasta').value = '';
        document.getElementById('f-estado').value = '';
        document.getElementById('f-estado-pago').value = '';
        document.getElementById('f-tipo-vianda').value = '';
        document.getElementById('f-segmento').value = '';
        document.getElementById('f-canal').value = '';
        clienteIdSeleccionado = null;
        cargarPedidos();
      });

      document.getElementById('btn-exportar').addEventListener('click', () => {
        const params = construirParams();
        const qs = params ? params + '&tipo=pedidos' : 'tipo=pedidos';
        const a = document.createElement('a');
        a.href = '/api/export?' + qs;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      document.getElementById('modal-pago-cancelar').addEventListener('click', () => {
        document.getElementById('modal-pago').classList.add('hidden');
      });
      document.getElementById('modal-pago-estado').addEventListener('change', toggleModalPagoMonto);
      document.getElementById('modal-pago-guardar').addEventListener('click', guardarPago);
    })();

    function toggleModalPagoMonto() {
      const esParcial = document.getElementById('modal-pago-estado').value === 'parcial';
      document.getElementById('modal-pago-grupo-monto').classList.toggle('hidden', !esParcial);
    }

    function abrirModalPago(ds) {
      pedidoEditando = { id: Number(ds.id), monto: Number(ds.monto) };
      document.getElementById('modal-pago-estado').value = ds.estado;
      document.getElementById('modal-pago-monto').value = '';
      toggleModalPagoMonto();
      document.getElementById('modal-pago-error').classList.add('hidden');
      document.getElementById('modal-pago').classList.remove('hidden');
    }

    async function guardarPago() {
      const estado_pago = document.getElementById('modal-pago-estado').value;
      const montoStr = document.getElementById('modal-pago-monto').value.trim();
      const errorBox = document.getElementById('modal-pago-error');
      const btn = document.getElementById('modal-pago-guardar');
      errorBox.classList.add('hidden');

      if (estado_pago === 'parcial' && (!montoStr || Number(montoStr) <= 0)) {
        errorBox.textContent = 'El monto abonado es requerido y debe ser mayor a 0.';
        errorBox.classList.remove('hidden');
        return;
      }

      const body = { estado_pago };
      if (estado_pago === 'parcial') body.monto_pagado = parseInt(montoStr, 10);

      btn.disabled = true;
      try {
        await api(`/api/pedidos/${pedidoEditando.id}/pago`, { method: 'PATCH', body });
        document.getElementById('modal-pago').classList.add('hidden');
        await cargarPedidos();
      } catch (e) {
        errorBox.textContent = e.message;
        errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    async function actualizarSugerenciasCliente() {
      const q = document.getElementById('f-cliente').value.trim();
      const datalist = document.getElementById('lista-clientes');
      if (!q) {
        datalist.innerHTML = '';
        clienteMap = {};
        return;
      }
      const { clientes } = await api('/api/clientes?q=' + encodeURIComponent(q));
      clienteMap = {};
      datalist.innerHTML = clientes.map(c => {
        const texto = `${c.nombre_completo} (${c.cedula})`;
        clienteMap[texto] = c.id;
        return `<option value="${texto}"></option>`;
      }).join('');
    }

    function actualizarClienteSeleccionado() {
      const valor = document.getElementById('f-cliente').value.trim();
      clienteIdSeleccionado = clienteMap[valor] || null;
    }

    function construirParams() {
      const params = new URLSearchParams();
      if (clienteIdSeleccionado) params.set('cliente_id', clienteIdSeleccionado);
      const desde = document.getElementById('f-fecha-desde').value;
      const hasta = document.getElementById('f-fecha-hasta').value;
      const estado = document.getElementById('f-estado').value;
      const estadoPago = document.getElementById('f-estado-pago').value;
      const tipoVianda = document.getElementById('f-tipo-vianda').value;
      const segmento = document.getElementById('f-segmento').value;
      const canal = document.getElementById('f-canal').value;
      if (desde) params.set('fecha_desde', desde);
      if (hasta) params.set('fecha_hasta', hasta);
      if (estado) params.set('estado', estado);
      if (estadoPago) params.set('estado_pago', estadoPago);
      if (tipoVianda) params.set('tipo_vianda', tipoVianda);
      if (segmento) params.set('segmento', segmento);
      if (canal) params.set('canal_origen', canal);
      return params.toString();
    }

    async function cargarPedidos() {
      const params = construirParams();
      const { pedidos } = await api('/api/pedidos' + (params ? '?' + params : ''));
      renderTabla(pedidos);
    }

    function renderTabla(pedidos) {
      document.getElementById('resultado-count').textContent =
        `Mostrando ${pedidos.length} pedido${pedidos.length === 1 ? '' : 's'}`;

      const puedeEditar = CURRENT_USER.rol === 'admin' || CURRENT_USER.rol === 'operador';

      const cont = document.getElementById('tabla-cont');
      if (!pedidos.length) {
        cont.innerHTML = '<div class="empty-state">No se encontraron pedidos con esos filtros.</div>';
      } else {
        cont.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Cliente</th><th>Segmento</th><th>Fecha pedido</th><th>Monto</th><th>Estado pago</th><th>Descripción</th></tr>
              </thead>
              <tbody>
                ${pedidos.map(p => `
                  <tr>
                    <td style="white-space:normal;min-width:160px;"><strong>${p.nombre_completo}</strong></td>
                    <td>${SEGMENTO_LABEL[p.segmento]}</td>
                    <td>${fmtFecha(p.fecha_pedido)}</td>
                    <td><strong>${fmtGs(p.monto)}</strong></td>
                    <td style="white-space:nowrap;">
                      ${badgeEstadoPago(p.estado_pago)}
                      ${puedeEditar ? `<button class="btn-secondary btn-editar-pago" data-id="${p.id}" data-estado="${p.estado_pago}" data-monto="${p.monto}" style="padding:2px 8px;font-size:9px;margin-left:6px;">Editar</button>` : ''}
                    </td>
                    <td style="white-space:normal;">${p.descripcion || '—'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        cont.querySelectorAll('.btn-editar-pago').forEach(btn => {
          btn.addEventListener('click', () => abrirModalPago(btn.dataset));
        });
      }

      const totalMonto = pedidos.reduce((sum, p) => sum + Number(p.monto || 0), 0);
      document.getElementById('resumen-grid').innerHTML = `
        <div class="metric metric-blue">
          <div class="metric-label">Cantidad de pedidos</div>
          <div class="metric-value">${pedidos.length}</div>
        </div>
        <div class="metric metric-green">
          <div class="metric-label">Total del período</div>
          <div class="metric-value" style="font-size:16px;">${fmtGs(totalMonto)}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
